name: Validate app JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate every inline JavaScript block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          for i, script in enumerate(scripts, 1):
              Path(f'/tmp/script-{i}.js').write_text(script, encoding='utf-8')
          print(f'Found {len(scripts)} JavaScript block(s)')
          PY
          for f in /tmp/script-*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          echo 'JavaScript syntax: OK'
      - name: Check critical split code
        run: |
          grep -F "t4.splitPercents[t4.participants[0]]=61.5" index.html
          grep -F "t4.splitPercents[t4.participants[1]]=38.5" index.html
          if grep -Fq "t4.splitPercents={[t4.participants[0]]" index.html; then
            echo 'Old invalid syntax is still present'
            exit 1
          fi
          echo 'Critical split code: OK'
