name: Validate and repair app JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair CSV syntax if needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s2=s.replace("join(',')});var blob", "join(','));});var blob")
          if s2!=s: p.write_text(s2,encoding='utf-8')
          PY
      - name: Fix split state and rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')

          def replace_function(src,name,replacement):
              marker='function '+name+'('
              start=src.find(marker)
              if start<0: raise SystemExit(name+' function not found')
              brace=src.find('{',start)
              if brace<0: raise SystemExit(name+' opening brace not found')
              depth=0; quote=None; esc=False; i=brace
              while i<len(src):
                  c=src[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return src[:start]+replacement+src[i+1:]
                  i+=1
              raise SystemExit(name+' closing brace not found')

          new_norm="""function normalisePercents(ps,p){var t=currentTrip();ps=ps||t.participants||[];p=p||t.splitPercents||{};var out={},has=false;ps.forEach(function(n){var raw=p[n];var v=parseFloat(String(raw==null?'':raw).replace(',','.'));if(isFinite(v)){out[n]=Math.max(0,Math.min(100,v));has=true}else out[n]=0});if(!has){if(ps.length===2){out[ps[0]]=38.5;out[ps[1]]=61.5}else{var q=ps.length?100/ps.length:0;ps.forEach(function(n){out[n]=q})}}return{values:out,total:ps.reduce(function(a,n){return a+(out[n]||0)},0)}}"""
          s=replace_function(s,'normalisePercents',new_norm)

          old_change="""document.addEventListener('change',function(ev){var el=ev.target;if(!el||!el.hasAttribute('data-pct'))return;var t=currentTrip(),name=el.getAttribute('data-pct'),value=Math.max(0,Math.min(100,num(el.value)));t.splitPercents=t.splitPercents||{};t.splitPercents[name]=value;var ps=t.participants||[],sum=ps.reduce(function(a,p){return a+num(t.splitPercents[p])},0);if(sum>0){ps.forEach(function(p){t.splitPercents[p]=num(t.splitPercents[p])*100/sum})}save();render()});"""
          new_change="""document.addEventListener('change',function(ev){var el=ev.target;if(!el||!el.hasAttribute('data-pct'))return;var t=currentTrip(),name=el.getAttribute('data-pct'),v=parseFloat(String(el.value).replace(',','.'));if(!isFinite(v))v=0;v=Math.max(0,Math.min(100,v));t.splitPercents=t.splitPercents||{};t.splitPercents[name]=v;save();render()});"""
          if old_change in s: s=s.replace(old_change,new_change,1)
          elif "t.splitPercents[name]=v" not in s: raise SystemExit('percentage change listener not found')

          old_add="""t4.splitPercents[t4.participants[0]]=61.5;t4.splitPercents[t4.participants[1]]=38.5;"""
          new_add="""t4.splitPercents[t4.participants[0]]=38.5;t4.splitPercents[t4.participants[1]]=61.5;"""
          if old_add in s: s=s.replace(old_add,new_add,1)

          new_render="""function renderSplit(){var sec=$('splitSec'),card=$('splitCard');if(!sec||!card)return;var s=null;try{s=computeSplit()}catch(e){s=null}if(!s){sec.hidden=true;card.innerHTML='';return}sec.hidden=false;var editor='';try{editor=renderPercentEditor()||''}catch(e){editor=''}var rs=s.rows.map(function(r){var bal=Math.abs(r.balance)<.005?'In pari':(r.balance>0?'Deve ricevere '+cur()+' '+money(r.balance):'Deve pagare '+cur()+' '+money(-r.balance));return '<div class=\"split-row\"><div class=\"split-person\"><b>'+esc(r.name)+'</b><span>Quota '+r.pct.toFixed(1)+'% · '+cur()+' '+money(r.share)+'</span></div><div class=\"split-paid\"><span>Pagato</span><b>'+cur()+' '+money(r.paid)+'</b></div><div class=\"split-balance\">'+bal+'</div></div>'}).join('');card.innerHTML=editor+'<div class=\"split-list\"><h3>Chi paga cosa</h3><div class=\"ssub\">La quota di ciascuno viene calcolata con la percentuale impostata.</div>'+rs+'</div>'}"""
          s=replace_function(s,'renderSplit',new_render)

          css=""".split-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}.split-person{flex:1;min-width:130px}.split-person b{display:block;font-size:14.5px;font-weight:500}.split-person span,.split-paid span{display:block;font-size:12px;color:var(--muted)}.split-paid{text-align:right}.split-paid b{font-size:14px;font-weight:600}.split-balance{width:100%;font-size:12.5px;color:var(--turq-dark);font-weight:500}.split-list h3{margin:0;padding:14px 14px 4px;font-size:15px;font-weight:600}.split-list .ssub{padding:0 14px 10px;font-size:12px;color:var(--muted)}"""
          if '.split-row{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          print('Split rendering fixed')
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          if not scripts: raise SystemExit('No JavaScript block found')
          for i,x in enumerate(scripts,1): Path(f'/tmp/script-{i}.js').write_text(x,encoding='utf-8')
          PY
          for f in /tmp/script-*.js; do node --check "$f"; done
          echo 'JavaScript syntax: OK'
      - name: Verify split fix and commit
        run: |
          grep -F "return{values:out,total:" index.html
          grep -F "t.splitPercents[name]=v" index.html
          grep -F "function renderSplit(){var sec=$('splitSec')" index.html
          grep -F ".split-row{" index.html
          grep -F "t4.splitPercents[t4.participants[0]]=38.5" index.html
          grep -F "t4.splitPercents[t4.participants[1]]=61.5" index.html
          if grep -Fq "t.splitPercents[p]=num(t.splitPercents[p])*100/sum" index.html; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix missing split section"
          git push
