name: Validate and repair app JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair known syntax error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [("join(',')});var blob", "join(','));});var blob"), ("join(','));var blob", "join(','));});var blob")]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True
                  print(f'Repaired: {old!r}')
          if changed:
              p.write_text(s, encoding='utf-8')
          else:
              print('No downloadCsv repair needed')
          PY
      - name: Validate every inline JavaScript block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          for i, script in enumerate(scripts, 1):
              Path(f'/tmp/script-{i}.js').write_text(script, encoding='utf-8')
          print(f'Found {len(scripts)} JavaScript block(s)')
          PY
          for f in /tmp/script-*.js; do node --check "$f"; done
          echo 'JavaScript syntax: OK'
      - name: Check critical split code and commit repair
        run: |
          grep -F "t4.splitPercents[t4.participants[0]]=61.5" index.html
          grep -F "t4.splitPercents[t4.participants[1]]=38.5" index.html
          if grep -Fq "t4.splitPercents={[t4.participants[0]]" index.html; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix remaining JavaScript syntax error"
          git push
